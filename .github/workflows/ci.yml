name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34 and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run unit tests and build the debug APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: renewal-radar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
